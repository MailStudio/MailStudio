        <rect x="50" y="111" width="26" height="18" rx="2"/><path d="M50 113l13 9 13-9"/>
        <rect x="132" y="110" width="26" height="20" rx="2"/><path d="M132 116h26M139 106v6M151 106v6"/>
        <path d="M214 112h22M214 120h16M214 128h22"/>
