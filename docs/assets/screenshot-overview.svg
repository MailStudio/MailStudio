    <line x1="8" y1="54" x2="1192" y2="54" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="34" cy="31" r="6" fill="#ff5f57"/>
    <circle cx="54" cy="31" r="6" fill="#febc2e"/>
    <circle cx="74" cy="31" r="6" fill="#28c840"/>
