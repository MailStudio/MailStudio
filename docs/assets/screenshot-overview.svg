    </g>

    <line x1="636" y1="172" x2="1160" y2="172" stroke="#ffffff" stroke-opacity="0.06"/>
    <g fill="#aab2be" font-size="13.5">
      <text x="636" y="206">Hi all — ahead of Thursday's review, here's the agenda and the</text>
      <text x="636" y="230">latest roadmap deck. Please add comments inline before EOD Wed.</text>
      <text x="636" y="266" fill="#cfd6df" font-weight="650">Agenda</text>
      <text x="636" y="292">•  Recap of Q2 outcomes</text>
      <text x="636" y="316">•  Q3 themes &amp; priorities</text>
      <text x="636" y="340">•  Capacity &amp; staffing</text>
      <text x="636" y="364">•  Open risks and dependencies</text>
    </g>
    <!-- attachment chip -->
    <rect x="636" y="392" width="220" height="48" rx="10" fill="#161a1e" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="650" y="404" width="24" height="24" rx="5" fill="#0f6cbd" fill-opacity="0.25"/>
    <path d="M656 410l6 0 4 4v8h-10z" fill="none" stroke="#4a9eea" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="686" y="414" font-size="12.5" font-weight="600" fill="#e9ebee">Roadmap_Q3.pdf</text>
    <text x="686" y="430" font-size="11" fill="#69707b">2.4 MB</text>

    <!-- focus timer card (bottom-left, floating in sidebar tools) -->
