<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="MailStudio main window — sidebar with live feeds next to the Outlook mail view">
  <defs>
    <clipPath id="win"><rect x="8" y="8" width="1184" height="744" rx="14"/></clipPath>
  </defs>

  <!-- window shadow + body -->
  <rect x="8" y="8" width="1184" height="744" rx="14" fill="#000000"/>
  <g clip-path="url(#win)">
