    <rect x="24" y="162" width="242" height="38" rx="9" fill="#212121"/>
    <circle cx="42" cy="181" r="4" fill="#34c759"/>
    <text x="56" y="186" font-size="12.5" fill="#9aa1ab"><tspan font-weight="700" fill="#e9ebee">4</tspan> emails · <tspan font-weight="700" fill="#e9ebee">2</tspan> events · <tspan font-weight="700" fill="#e9ebee">3</tspan> tasks</text>

