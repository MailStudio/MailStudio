    <rect x="300" y="110" width="3" height="74" rx="2" fill="#0f6cbd"/>
    <text x="318" y="134" font-size="13" font-weight="700" fill="#e9ebee">Alex Morgan</text>
    <text x="576" y="134" text-anchor="end" font-size="11" fill="#69707b">9:24 AM</text>
    <text x="318" y="153" font-size="12.5" font-weight="600" fill="#cfd6df">Q3 roadmap review — agenda</text>
    <text x="318" y="171" font-size="11.5" fill="#9aa1ab">Sharing the deck ahead of Thursday's…</text>

    <g opacity="0.92">
      <text x="318" y="216" font-size="13" font-weight="700" fill="#e9ebee">Design Team</text>
      <text x="576" y="216" text-anchor="end" font-size="11" fill="#69707b">11:02 AM</text>
      <text x="318" y="235" font-size="12.5" font-weight="500" fill="#aab2be">Weekly standup notes</text>
      <text x="318" y="253" font-size="11.5" fill="#69707b">Recap and action items from this…</text>
    </g>
    <line x1="300" y1="280" x2="592" y2="280" stroke="#ffffff" stroke-opacity="0.05"/>
    <g opacity="0.92">
      <text x="318" y="306" font-size="13" font-weight="700" fill="#e9ebee">GitHub</text>
      <text x="576" y="306" text-anchor="end" font-size="11" fill="#69707b">8:47 AM</text>
      <text x="318" y="325" font-size="12.5" font-weight="500" fill="#aab2be">Build passed on main</text>
      <text x="318" y="343" font-size="11.5" fill="#69707b">All checks have completed…</text>
    </g>
    <line x1="300" y1="370" x2="592" y2="370" stroke="#ffffff" stroke-opacity="0.05"/>
    <g opacity="0.82">
      <text x="318" y="396" font-size="13" font-weight="700" fill="#e9ebee">Notion</text>
      <text x="576" y="396" text-anchor="end" font-size="11" fill="#69707b">Yesterday</text>
      <text x="318" y="415" font-size="12.5" font-weight="500" fill="#aab2be">Your weekly digest</text>
    </g>

    <!-- reading pane -->
    <text x="636" y="100" font-size="20" font-weight="750" fill="#f2f4f7">Q3 roadmap review — agenda</text>
    <circle cx="650" cy="136" r="16" fill="#0f6cbd"/>
    <text x="650" y="141" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AM</text>
    <text x="676" y="132" font-size="13.5" font-weight="650" fill="#e9ebee">Alex Morgan</text>
    <text x="676" y="150" font-size="11.5" fill="#9aa1ab">to me · 9:24 AM</text>
    <g stroke="#9aa1ab" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
